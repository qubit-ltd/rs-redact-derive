[package]
name = "qubit-redact-derive"
version = "0.5.0"
edition = "2024"
rust-version = "1.94"
authors = ["Haixing Hu <starfish.hu@gmail.com>"]
license = "Apache-2.0"
repository = "https://github.com/qubit-ltd/rs-redact-derive"
homepage = "https://github.com/qubit-ltd/rs-redact-derive"
documentation = "https://docs.rs/qubit-redact-derive"
readme = "README.md"
description = "Derive macros for qubit-redact domain-object formatting"
keywords = ["redact", "mask", "privacy", "derive", "qubit"]
categories = ["development-tools::procedural-macro-helpers"]
include = [
    "/Cargo.toml",
    "/Cargo.lock",
    "/LICENSE",
    "/README.md",
    "/README.zh_CN.md",
    "/src/**",
    "/doc/**",
    "/tests/**",
]
publish = true
autotests = false

[package.metadata.docs.rs]
all-features = true

[features]
test-json = ["qubit-redact/json"]

[lib]
proc-macro = true

[[test]]
name = "compile_tests"
path = "tests/compile_tests.rs"

[[test]]
name = "serde_runtime_tests"
path = "tests/serde_runtime_tests.rs"

[[test]]
name = "serde_expansion_tests"
path = "tests/serde_expansion_tests.rs"

[[test]]
name = "serde_enum_representation_tests"
path = "tests/serde_enum_representation_tests.rs"

[[test]]
name = "unified_redact_tests"
path = "tests/unified_redact_tests.rs"

[[test]]
name = "renamed_dependency_tests"
path = "tests/renamed_dependency_tests.rs"

[[test]]
name = "runtime_path_tests"
path = "tests/runtime_path_tests.rs"

[[test]]
name = "serde_dependency_tests"
path = "tests/serde_dependency_tests.rs"

[[test]]
name = "serde_feature_guard_tests"
path = "tests/serde_feature_guard_tests.rs"

[[test]]
name = "serde_path_tests"
path = "tests/serde_path_tests.rs"

[dependencies]
proc-macro-crate = "3"
proc-macro2 = "1"
quote = "1"
syn = "2"

[dev-dependencies]
qubit-redact = { version = "0.5", path = "../rs-redact", default-features = false, features = ["serde", "json"] }
qubit-budget = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
trybuild = "1"
