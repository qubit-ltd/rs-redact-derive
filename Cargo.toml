[package]
name = "qubit-redact-derive"
version = "0.5.0"
edition = "2024"
rust-version = "1.94"
authors = ["Haixing Hu <starfish.hu@gmail.com>"]
license = "Apache-2.0"
repository = "https://github.com/qubit-ltd/rs-redact-derive"
homepage = "https://github.com/qubit-ltd/rs-redact-derive"
documentation = "https://docs.rs/qubit-redact-derive"
readme = "README.md"
description = "Derive macros for qubit-redact domain-object formatting"
keywords = ["redact", "mask", "privacy", "derive", "qubit"]
categories = ["development-tools::procedural-macro-helpers"]
include = [
    "/Cargo.toml",
    "/Cargo.lock",
    "/LICENSE",
    "/README.md",
    "/README.zh_CN.md",
    "/src/**",
    "/core/**",
    "/doc/**",
    "/tests/**",
]
publish = true

[package.metadata.docs.rs]
all-features = true

[features]
test-json = ["qubit-redact/json"]

[lib]
proc-macro = true
test = false

[dependencies]
qubit-redact-derive-core = { version = "0.4.1", path = "core" }
proc-macro-crate = "3"
proc-macro2 = "1"
quote = "1"
syn = "2"

[dev-dependencies]
qubit-redact = { version = "0.5", path = "../rs-redact", default-features = false, features = ["serde"] }
qubit-budget = "0.3"
qubit-redact-derive-core = { version = "0.4.1", path = "core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
trybuild = "1"
